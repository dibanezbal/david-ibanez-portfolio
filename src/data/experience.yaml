- id: zurich-test-quality-lead
  role: Test and Quality Lead
  company: Zurich Insurance Group
  location: Barcelona
  startDate: 2025-06-01
  highlights:
    - Reduzco un 65 % el tiempo de ejecución manual de pruebas con un portal interno que he diseñado y desarrollado para centralizar todas las automatizaciones de QA.
    - Detecto las regresiones antes de cada despliegue al integrar Playwright y Low Code en los pipelines CI/CD de Azure DevOps.
    - Amplío la cobertura de pruebas a los edge cases que las herramientas automáticas no detectan combinando la validación manual de interacciones y estados con IA.
    - Llevé la primera fase de la migración de un sitio de 2.000 páginas a superar el quality gate con un 98 %, tres puntos por encima del 95 % exigido, con la estrategia de UAT que defino y superviso.
